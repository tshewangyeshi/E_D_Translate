[project]
name = "dzweb-orchestrator"
version = "0.1.0"
description = "dzweb: English to Dzongkha web translation middleware (orchestrator)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests/orchestrator"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["adapters", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is how pytest tests work

[tool.mypy]
python_version = "3.11"
strict = true
files = ["orchestrator", "tools"]
